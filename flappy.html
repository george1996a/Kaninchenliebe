<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Flappy Benji 🐰</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;

            background: #f5e9dc;

            display: flex;
            justify-content: center;
            align-items: center;

            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;

            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }


        /* =====================================
           SPIEL
           ===================================== */

        #gameWrapper {

            position: relative;

            width: min(100vw, 520px);

            height: min(100dvh, 900px);

            overflow: hidden;

            background: #dff3f5;

            box-shadow:
                0 20px 60px rgba(80, 55, 45, 0.20);

            border-radius: 0;
        }


        canvas {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;
        }


        /* =====================================
           HUD
           ===================================== */

        #hud {

            position: absolute;

            top: max(18px, env(safe-area-inset-top));

            left: 0;
            right: 0;

            z-index: 10;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            pointer-events: none;
        }


        .scoreBox {

            min-width: 115px;

            padding: 9px 16px 10px;

            background:
                rgba(255, 253, 249, 0.88);

            border: 1px solid rgba(255,255,255,0.8);

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 7px 22px rgba(91, 65, 54, 0.13);

            backdrop-filter: blur(8px);
        }


        .scoreLabel {

            font-family:
                Arial,
                sans-serif;

            font-size: 10px;

            letter-spacing: 1.4px;

            color: #927b70;

            font-weight: 700;
        }


        .scoreValue {

            margin-top: 1px;

            font-family:
                Arial,
                sans-serif;

            font-size: 23px;

            line-height: 1.1;

            color: #654d43;

            font-weight: 800;
        }


        /* =====================================
           ZURÜCK
           ===================================== */

        #backButton {

            position: absolute;

            left: 15px;

            bottom:
                max(15px, env(safe-area-inset-bottom));

            z-index: 12;

            padding: 8px 14px;

            border-radius: 20px;

            background:
                rgba(255, 253, 249, 0.82);

            color: #735c51;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-size: 12px;

            box-shadow:
                0 5px 15px rgba(80, 55, 45, 0.10);

            backdrop-filter: blur(6px);
        }


        /* =====================================
           START / GAME OVER
           ===================================== */

        #overlay {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            background:
                rgba(250, 245, 238, 0.66);

            backdrop-filter: blur(7px);
        }


        #panel {

            width: min(88vw, 360px);

            padding: 30px 24px 26px;

            background:
                rgba(255, 253, 249, 0.96);

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 20px 55px rgba(80, 55, 45, 0.20);
        }


        #panel h1 {

            color: #674f45;

            font-size:
                clamp(2rem, 9vw, 3rem);

            margin-bottom: 8px;
        }


        #message {

            color: #806d63;

            font-size: 15px;

            line-height: 1.5;

            margin-bottom: 18px;
        }


        #finalScore {

            color: #6b5147;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        #bestScore {

            color: #c27676;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 22px;
        }


        #gameButton {

            border: none;

            padding: 13px 28px;

            border-radius: 50px;

            background: #d58787;

            color: white;

            font-family: Georgia, serif;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 22px rgba(213, 135, 135, 0.30);

            -webkit-tap-highlight-color: transparent;
        }


        #hint {

            margin-top: 15px;

            color: #9a8980;

            font-family: Arial, sans-serif;

            font-size: 12px;

            line-height: 1.6;
        }


        /* =====================================
           KLEINE HANDYS
           ===================================== */

        @media (max-height: 700px) {

            #hud {
                top: 10px;
            }

            .scoreBox {
                padding: 7px 13px;
                min-width: 105px;
            }

            .scoreValue {
                font-size: 20px;
            }

            #panel {
                padding: 22px 20px;
            }

            #panel h1 {
                font-size: 2rem;
            }
        }


        @media (min-width: 521px) {

            #gameWrapper {
                border-radius: 28px;
            }
        }

    </style>
</head>


<body>

<div id="gameWrapper">

    <canvas id="gameCanvas"></canvas>


    <!-- ================================
         PUNKTE
         ================================ -->

    <div id="hud">

        <div class="scoreBox">

            <div class="scoreLabel">
                PUNKTE
            </div>

            <div
                class="scoreValue"
                id="score"
            >
                0
            </div>

        </div>


        <div class="scoreBox">

            <div class="scoreLabel">
                🏆 HIGHSCORE
            </div>

            <div
                class="scoreValue"
                id="highscore"
            >
                0
            </div>

        </div>

    </div>


    <!-- ================================
         START / GAME OVER
         ================================ -->

    <div id="overlay">

        <div id="panel">

            <h1>
                🐰 Flappy Benji
            </h1>

            <p id="message">
                Hilf Benji, alle Möhrchen zu erwischen! 🥕
            </p>

            <div id="finalScore">
                Punkte: 0
            </div>

            <div id="bestScore">
                🏆 Highscore: 0
            </div>

            <button id="gameButton">
                Los geht's! 🐰
            </button>

            <div id="hint">
                📱 Tippe zum Springen<br>
                💻 Klick oder Leertaste
            </div>

        </div>

    </div>


    <a
        id="backButton"
        href="index.html"
    >
        ← Zurück
    </a>

</div>


<script>

/* ==========================================
   ELEMENTE
   ========================================== */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const wrapper =
    document.getElementById("gameWrapper");

const scoreElement =
    document.getElementById("score");

const highscoreElement =
    document.getElementById("highscore");

const overlay =
    document.getElementById("overlay");

const gameButton =
    document.getElementById("gameButton");

const message =
    document.getElementById("message");

const finalScore =
    document.getElementById("finalScore");

const bestScore =
    document.getElementById("bestScore");


/* ==========================================
   BENJI
   ========================================== */

const benjiImage =
    new Image();

benjiImage.src =
    "images/benji.png";


/* ==========================================
   HIGHScore
   ========================================== */

let highscore =
    Number(
        localStorage.getItem(
            "flappyBunnyHighscore"
        )
    ) || 0;

highscoreElement.textContent =
    highscore;


/* ==========================================
   SPIEL
   ========================================== */

let gameRunning = false;

let score = 0;

let lastTime = 0;

let animationFrame;

let carrotTimer = 0;

let obstacleTimer = 0;

let carrots = [];

let obstacles = [];

let particles = [];


/* ==========================================
   BENJI WERTE
   ========================================== */

const bunny = {

    x: 0,

    y: 0,

    width: 76,

    height: 76,

    velocity: 0,

    gravity: 0.00165,

    jumpPower: -0.53

};


/* ==========================================
   CANVAS GRÖSSE
   ========================================== */

function resizeCanvas() {

    canvas.width =
        wrapper.clientWidth;

    canvas.height =
        wrapper.clientHeight;


    bunny.x =
        canvas.width * 0.20;

}

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==========================================
   SPIEL START
   ========================================== */

function startGame() {

    gameRunning = true;

    score = 0;

    carrots = [];

    obstacles = [];

    particles = [];

    carrotTimer = 0;

    obstacleTimer = 0;

    bunny.x =
        canvas.width * 0.20;

    bunny.y =
        canvas.height * 0.45;

    bunny.velocity = 0;

    scoreElement.textContent =
        "0";

    overlay.style.display =
        "none";

    lastTime =
        performance.now();

    animationFrame =
        requestAnimationFrame(
            gameLoop
        );
}


/* ==========================================
   SPRINGEN
   ========================================== */

function jump() {

    if (!gameRunning) {
        return;
    }

    bunny.velocity =
        bunny.jumpPower;

}


/* ==========================================
   KAROTTE ERSTELLEN
   ========================================== */

function createCarrot() {

    const margin = 100;

    const minY = 100;

    const maxY =
        canvas.height - margin;

    carrots.push({

        x:
            canvas.width + 40,

        y:
            minY +
            Math.random() *
            (maxY - minY),

        size:
            34,

        rotation:
            (Math.random() - 0.5) * 0.3,

        collected: false

    });

}


/* ==========================================
   HINDERNISSE
   ========================================== */

function createObstacle() {

    const gap = 190;

    const minTop = 80;

    const maxTop =
        canvas.height -
        gap -
        120;

    const top =
        minTop +
        Math.random() *
        (maxTop - minTop);

    obstacles.push({

        x:
            canvas.width + 50,

        width:
            72,

        top:
            top,

        bottom:
            top + gap

    });

}


/* ==========================================
   KOLLISION BENJI / KAROTTE
   ========================================== */

function carrotCollision(carrot) {

    const bx =
        bunny.x + bunny.width / 2;

    const by =
        bunny.y + bunny.height / 2;

    const cx =
        carrot.x;

    const cy =
        carrot.y;

    const distance =
        Math.hypot(
            bx - cx,
            by - cy
        );

    return distance <
        45;

}


/* ==========================================
   KOLLISION HINDERNIS
   ========================================== */

function obstacleCollision(obstacle) {

    const padding = 10;

    const left =
        bunny.x + padding;

    const right =
        bunny.x +
        bunny.width -
        padding;

    const top =
        bunny.y + padding;

    const bottom =
        bunny.y +
        bunny.height -
        padding;


    return (

        right > obstacle.x &&

        left <
            obstacle.x +
            obstacle.width &&

        (
            top < obstacle.top ||
            bottom > obstacle.bottom
        )

    );

}


/* ==========================================
   PARTIKEL
   ========================================== */

function createParticles(
    x,
    y
) {

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() - 0.5)
                * 0.15,

            vy:
                (Math.random() - 0.5)
                * 0.15,

            life: 1,

            size:
                3 +
                Math.random() * 4

        });

    }

}


/* ==========================================
   GAME OVER
   ========================================== */

function endGame() {

    gameRunning = false;

    cancelAnimationFrame(
        animationFrame
    );


    let newRecord = false;


    if (score > highscore) {

        highscore =
            score;

        localStorage.setItem(
            "flappyBunnyHighscore",
            highscore
        );

        newRecord = true;

    }


    highscoreElement.textContent =
        highscore;


    finalScore.textContent =
        "Punkte: " + score;


    bestScore.textContent =
        "🏆 Highscore: " + highscore;


    if (newRecord && score > 0) {

        message.textContent =
            "✨ NEUER REKORD! Benji ist stolz! ✨";

    } else {

        message.textContent =
            "Benji braucht kurz eine Möhrchenpause. 🐰";

    }


    gameButton.textContent =
        "Nochmal spielen 🔄";


    overlay.style.display =
        "flex";

}


/* ==========================================
   GAME LOOP
   ========================================== */

function gameLoop(timestamp) {

    if (!gameRunning) {
        return;
    }


    const delta =
        Math.min(
            timestamp - lastTime,
            30
        );

    lastTime =
        timestamp;


    update(delta);

    draw();


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* ==========================================
   UPDATE
   ========================================== */

function update(delta) {

    /* BENJI */

    bunny.velocity +=
        bunny.gravity * delta;

    bunny.y +=
        bunny.velocity * delta;


    /* BODEN */

    const ground =
        canvas.height - 65;


    if (
        bunny.y +
        bunny.height >
        ground
    ) {

        endGame();

        return;

    }


    /* DECKE */

    if (bunny.y < 0) {

        bunny.y = 0;

        bunny.velocity = 0;

    }


    /* KAROTTEN */

    carrotTimer += delta;


    if (carrotTimer > 1150) {

        createCarrot();

        carrotTimer = 0;

    }


    carrots.forEach(
        carrot => {

            carrot.x -=
                0.19 * delta;


            if (
                !carrot.collected &&
                carrotCollision(carrot)
            ) {

                carrot.collected =
                    true;

                score++;

                scoreElement.textContent =
                    score;

                createParticles(
                    carrot.x,
                    carrot.y
                );

            }

        }
    );


    carrots =
        carrots.filter(
            carrot =>
                carrot.x > -60 &&
                !carrot.collected
        );


    /* HINDERNISSE */

    obstacleTimer += delta;


    if (obstacleTimer > 1900) {

        createObstacle();

        obstacleTimer = 0;

    }


    obstacles.forEach(
        obstacle => {

            obstacle.x -=
                0.18 * delta;


            if (
                obstacleCollision(
                    obstacle
                )
            ) {

                endGame();

            }

        }
    );


    obstacles =
        obstacles.filter(
            obstacle =>
                obstacle.x >
                -obstacle.width
        );


    /* PARTIKEL */

    particles.forEach(
        particle => {

            particle.x +=
                particle.vx * delta;

            particle.y +=
                particle.vy * delta;

            particle.life -=
                0.002 * delta;

        }
    );


    particles =
        particles.filter(
            particle =>
                particle.life > 0
        );

}


/* ==========================================
   ZEICHNEN
   ========================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawBackground();

    drawObstacles();

    drawCarrots();

    drawParticles();

    drawAirTrail();

    drawBunny();

    drawGround();

}


/* ==========================================
   HINTERGRUND
   ========================================== */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#b9e6f1"
    );

    gradient.addColorStop(
        0.52,
        "#e9f5ec"
    );

    gradient.addColorStop(
        0.76,
        "#d9e8bd"
    );

    gradient.addColorStop(
        1,
        "#a8cf8c"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SONNE */

    ctx.fillStyle =
        "rgba(255,235,168,0.9)";

    ctx.beginPath();

    ctx.arc(
        canvas.width * 0.82,
        105,
        40,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* WOLKEN */

    drawCloud(
        canvas.width * 0.20,
        120,
        0.9
    );

    drawCloud(
        canvas.width * 0.72,
        205,
        0.65
    );


    /* HÜGEL */

    ctx.fillStyle =
        "#bdd99f";

    ctx.beginPath();

    ctx.moveTo(
        0,
        canvas.height * 0.68
    );

    ctx.quadraticCurveTo(
        canvas.width * 0.25,
        canvas.height * 0.56,
        canvas.width * 0.5,
        canvas.height * 0.68
    );

    ctx.quadraticCurveTo(
        canvas.width * 0.76,
        canvas.height * 0.52,
        canvas.width,
        canvas.height * 0.66
    );

    ctx.lineTo(
        canvas.width,
        canvas.height
    );

    ctx.lineTo(
        0,
        canvas.height
    );

    ctx.closePath();

    ctx.fill();

}


/* ==========================================
   WOLKE
   ========================================== */

function drawCloud(
    x,
    y,
    scale
) {

    ctx.fillStyle =
        "rgba(255,255,255,0.72)";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        22 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 24 * scale,
        y - 12 * scale,
        30 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 52 * scale,
        y,
        23 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* ==========================================
   HINDERNISSE ZEICHNEN
   ========================================== */

function drawObstacles() {

    obstacles.forEach(
        obstacle => {

            drawLeafObstacle(
                obstacle.x,
                0,
                obstacle.width,
                obstacle.top
            );


            drawLeafObstacle(
                obstacle.x,
                obstacle.bottom,
                obstacle.width,
                canvas.height -
                obstacle.bottom -
                65
            );

        }
    );

}


/* ==========================================
   GRÜNE HINDERNISSE
   ========================================== */

function drawLeafObstacle(
    x,
    y,
    width,
    height
) {

    if (height <= 0) {
        return;
    }


    ctx.fillStyle =
        "#7fae6b";

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.fillStyle =
        "#659456";

    ctx.fillRect(
        x,
        y,
        9,
        height
    );

    ctx.fillRect(
        x + width - 9,
        y,
        9,
        height
    );


    /* kleine Blätter */

    ctx.fillStyle =
        "#527e49";


    for (
        let yy = y + 18;
        yy < y + height;
        yy += 32
    ) {

        ctx.beginPath();

        ctx.ellipse(
            x + width * 0.5,
            yy,
            12,
            5,
            -0.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* ==========================================
   KAROTTEN
   ========================================== */

function drawCarrots() {

    carrots.forEach(
        carrot => {

            ctx.save();

            ctx.translate(
                carrot.x,
                carrot.y
            );

            ctx.rotate(
                carrot.rotation
            );


            /* GRÜN */

            ctx.fillStyle =
                "#5f9d58";


            ctx.beginPath();

            ctx.ellipse(
                -5,
                -17,
                4,
                12,
                -0.5,
                0,
                Math.PI * 2
            );

            ctx.ellipse(
                2,
                -18,
                4,
                13,
                0.1,
                0,
                Math.PI * 2
            );

            ctx.ellipse(
                8,
                -15,
                4,
                11,
                0.5,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* KAROTTE */

            ctx.fillStyle =
                "#ee8758";


            ctx.beginPath();

            ctx.moveTo(
                -11,
                -10
            );

            ctx.quadraticCurveTo(
                0,
                -3,
                9,
                -10
            );

            ctx.lineTo(
                2,
                20
            );

            ctx.quadraticCurveTo(
                0,
                25,
                -3,
                20
            );

            ctx.closePath();

            ctx.fill();


            /* kleine Linien */

            ctx.strokeStyle =
                "#d96e47";

            ctx.lineWidth = 1.5;


            ctx.beginPath();

            ctx.moveTo(
                -6,
                -4
            );

            ctx.lineTo(
                2,
                -2
            );

            ctx.moveTo(
                -5,
                5
            );

            ctx.lineTo(
                2,
                7
            );

            ctx.stroke();


            ctx.restore();

        }
    );

}


/* ==========================================
   LUFTSTOSS HINTER BENJI
   ========================================== */

function drawAirTrail() {

    if (!gameRunning) {
        return;
    }


    const x =
        bunny.x - 8;

    const y =
        bunny.y +
        bunny.height / 2;


    ctx.save();

    ctx.lineCap =
        "round";


    /* große weiche Luft */

    ctx.strokeStyle =
        "rgba(255,255,255,0.65)";

    ctx.lineWidth = 6;


    ctx.beginPath();

    ctx.moveTo(
        x - 25,
        y - 17
    );

    ctx.quadraticCurveTo(
        x - 48,
        y - 21,
        x - 65,
        y - 13
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        x - 22,
        y + 8
    );

    ctx.quadraticCurveTo(
        x - 48,
        y + 12,
        x - 62,
        y + 5
    );

    ctx.stroke();


    /* dünne Linien */

    ctx.strokeStyle =
        "rgba(255,255,255,0.82)";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        x - 15,
        y
    );

    ctx.lineTo(
        x - 55,
        y
    );

    ctx.moveTo(
        x - 12,
        y + 25
    );

    ctx.lineTo(
        x - 43,
        y + 29
    );

    ctx.stroke();


    ctx.restore();

}


/* ==========================================
   BENJI
   ========================================== */

function drawBunny() {

    const rotation =
        Math.max(
            -0.18,
            Math.min(
                0.38,
                bunny.velocity * 0.45
            )
        );


    ctx.save();


    ctx.translate(
        bunny.x +
        bunny.width / 2,
        bunny.y +
        bunny.height / 2
    );


    ctx.rotate(
        rotation
    );


    if (
        benjiImage.complete &&
        benjiImage.naturalWidth > 0
    ) {

        ctx.drawImage(
            benjiImage,
            -bunny.width / 2,
            -bunny.height / 2,
            bunny.width,
            bunny.height
        );

    } else {

        ctx.font =
            "60px serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "🐰",
            0,
            0
        );

    }


    ctx.restore();

}


/* ==========================================
   PARTIKEL
   ========================================== */

function drawParticles() {

    particles.forEach(
        particle => {

            ctx.globalAlpha =
                particle.life;

            ctx.fillStyle =
                "#f4b36d";


            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    ctx.globalAlpha = 1;

}


/* ==========================================
   BODEN
   ========================================== */

function drawGround() {

    const groundHeight = 65;


    ctx.fillStyle =
        "#a8ce8b";


    ctx.fillRect(
        0,
        canvas.height - groundHeight,
        canvas.width,
        groundHeight
    );


    /* Gras */

    ctx.strokeStyle =
        "#709d5e";

    ctx.lineWidth = 2;


    for (
        let x = 0;
        x < canvas.width;
        x += 17
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            canvas.height -
            groundHeight
        );

        ctx.lineTo(
            x + 5,
            canvas.height -
            groundHeight -
            8
        );

        ctx.stroke();

    }

}


/* ==========================================
   TOUCH
   ========================================== */

canvas.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        jump();

    },
    {
        passive: false
    }
);


/* ==========================================
   MAUS
   ========================================== */

canvas.addEventListener(
    "mousedown",
    function(event) {

        event.preventDefault();

        jump();

    }
);


/* ==========================================
   TASTATUR
   ========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }

    }
);


/* ==========================================
   BUTTON
   ========================================== */

gameButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        startGame();

    }
);


/* ==========================================
   ERSTER FRAME
   ========================================== */

draw();

</script>
