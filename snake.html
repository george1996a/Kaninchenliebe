<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Malina Snake 🐰</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;

    background: #f5e9dc;

    display: flex;
    justify-content: center;
    align-items: center;

    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}


/* =====================================
   SPIEL
   ===================================== */

#gameWrapper {
    position: relative;

    width: min(100vw, 520px);
    height: min(100dvh, 900px);

    overflow: hidden;

    background: #dff0df;

    box-shadow:
        0 20px 60px rgba(80, 55, 45, 0.20);
}


/* =====================================
   CANVAS
   ===================================== */

canvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =====================================
   HUD
   ===================================== */

#hud {
    position: absolute;

    top: max(18px, env(safe-area-inset-top));

    left: 0;
    right: 0;

    z-index: 10;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 12px;

    pointer-events: none;
}

.scoreBox {
    min-width: 115px;

    padding: 9px 16px 10px;

    background:
        rgba(255, 253, 249, 0.90);

    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 7px 22px rgba(91, 65, 54, 0.13);

    backdrop-filter: blur(8px);
}

.scoreLabel {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 1.4px;

    color: #927b70;

    font-weight: 700;
}

.scoreValue {
    margin-top: 1px;

    font-family: Arial, sans-serif;

    font-size: 23px;

    color: #654d43;

    font-weight: 800;
}


/* =====================================
   ZURÜCK
   ===================================== */

#backButton {
    position: absolute;

    left: 15px;

    bottom:
        max(15px, env(safe-area-inset-bottom));

    z-index: 12;

    padding: 8px 14px;

    border-radius: 20px;

    background:
        rgba(255, 253, 249, 0.85);

    color: #735c51;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 12px;

    box-shadow:
        0 5px 15px rgba(80, 55, 45, 0.10);

    backdrop-filter: blur(6px);
}


/* =====================================
   OVERLAY
   ===================================== */

#overlay {
    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 25px;

    background:
        rgba(250, 245, 238, 0.66);

    backdrop-filter: blur(7px);
}

#panel {
    width: min(88vw, 360px);

    padding: 30px 24px 26px;

    background:
        rgba(255, 253, 249, 0.97);

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 20px 55px rgba(80, 55, 45, 0.20);
}

#panel h1 {
    color: #674f45;

    font-size:
        clamp(2rem, 9vw, 3rem);

    margin-bottom: 8px;
}

#message {
    color: #806d63;

    font-size: 15px;

    line-height: 1.5;

    margin-bottom: 18px;
}

#finalScore {
    color: #6b5147;

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 5px;
}

#bestScore {
    color: #c27676;

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 22px;
}

#gameButton {
    border: none;

    padding: 13px 28px;

    border-radius: 50px;

    background: #d58787;

    color: white;

    font-family: Georgia, serif;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 22px rgba(213, 135, 135, 0.30);
}

#hint {
    margin-top: 15px;

    color: #9a8980;

    font-family: Arial, sans-serif;

    font-size: 12px;

    line-height: 1.6;
}


@media (max-height: 700px) {

    #hud {
        top: 10px;
    }

    .scoreBox {
        padding: 7px 13px;
        min-width: 105px;
    }

    .scoreValue {
        font-size: 20px;
    }

    #panel {
        padding: 22px 20px;
    }
}

@media (min-width: 521px) {

    #gameWrapper {
        border-radius: 28px;
    }
}

</style>
</head>


<body>

<div id="gameWrapper">

    <canvas id="gameCanvas"></canvas>


    <!-- PUNKTE -->

    <div id="hud">

        <div class="scoreBox">

            <div class="scoreLabel">
                PUNKTE
            </div>

            <div
                class="scoreValue"
                id="score"
            >
                0
            </div>

        </div>


        <div class="scoreBox">

            <div class="scoreLabel">
                🏆 HIGHSCORE
            </div>

            <div
                class="scoreValue"
                id="highscore"
            >
                0
            </div>

        </div>

    </div>


    <!-- START / GAME OVER -->

    <div id="overlay">

        <div id="panel">

            <h1>
                🐰 Malina Snake
            </h1>

            <p id="message">
                Hilf Malina, alle Möhrchen zu finden! 🥕
            </p>

            <div id="finalScore">
                Punkte: 0
            </div>

            <div id="bestScore">
                🏆 Highscore: 0
            </div>

            <button id="gameButton">
                Los geht's! 🐰
            </button>

            <div id="hint">
                📱 Wische zum Steuern<br>
                💻 Pfeiltasten benutzen
            </div>

        </div>

    </div>


    <a
        id="backButton"
        href="index.html"
    >
        ← Zurück
    </a>

</div>


<script>

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const wrapper =
    document.getElementById("gameWrapper");

const scoreElement =
    document.getElementById("score");

const highscoreElement =
    document.getElementById("highscore");

const overlay =
    document.getElementById("overlay");

const gameButton =
    document.getElementById("gameButton");

const message =
    document.getElementById("message");

const finalScore =
    document.getElementById("finalScore");

const bestScore =
    document.getElementById("bestScore");


/* =====================================
   MALINA
   ===================================== */

const malinaImage =
    new Image();

malinaImage.src =
    "images/malina.png";


/* =====================================
   HIGHScore
   ===================================== */

let highscore =
    Number(
        localStorage.getItem(
            "snakeBunnyHighscore"
        )
    ) || 0;

highscoreElement.textContent =
    highscore;


/* =====================================
   CANVAS
   ===================================== */

function resizeCanvas() {

    canvas.width =
        wrapper.clientWidth;

    canvas.height =
        wrapper.clientHeight;

    setupGrid();

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================
   SPIEL
   ===================================== */

let gameRunning = false;

let score = 0;

let snake = [];

let food = {};

let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};

let gameTimer;

let gridSize = 24;

let cols;

let rows;


/* =====================================
   GRID
   ===================================== */

function setupGrid() {

    cols =
        Math.floor(
            canvas.width / gridSize
        );

    rows =
        Math.floor(
            canvas.height / gridSize
        );

}


/* =====================================
   START
   ===================================== */

function startGame() {

    setupGrid();

    score = 0;

    scoreElement.textContent =
        "0";

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };


    const startX =
        Math.floor(cols * 0.4);

    const startY =
        Math.floor(rows * 0.5);


    snake = [

        {
            x: startX,
            y: startY
        },

        {
            x: startX - 1,
            y: startY
        },

        {
            x: startX - 2,
            y: startY
        },

        {
            x: startX - 3,
            y: startY
        }

    ];


    createFood();


    overlay.style.display =
        "none";


    gameRunning = true;


    clearInterval(gameTimer);


    gameTimer =
        setInterval(
            gameLoop,
            115
        );


    draw();

}


/* =====================================
   MÖHRE
   ===================================== */

function createFood() {

    let valid = false;


    while (!valid) {

        food = {

            x:
                Math.floor(
                    Math.random() *
                    (cols - 2)
                ) + 1,

            y:
                Math.floor(
                    Math.random() *
                    (rows - 5)
                ) + 2

        };


        valid =
            !snake.some(
                segment =>
                    segment.x === food.x &&
                    segment.y === food.y
            );

    }

}


/* =====================================
   GAME LOOP
   ===================================== */

function gameLoop() {

    if (!gameRunning) {
        return;
    }


    direction =
        nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WAND */

    if (
        head.x < 0 ||
        head.x >= cols ||
        head.y < 1 ||
        head.y >= rows - 3
    ) {

        endGame();

        return;

    }


    /* KÖRPER */

    if (
        snake.some(
            segment =>
                segment.x === head.x &&
                segment.y === head.y
        )
    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    /* MÖHRE GEFRESSEN */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreElement.textContent =
            score;

        createFood();

    } else {

        snake.pop();

    }


    draw();

}


/* =====================================
   GAME OVER
   ===================================== */

function endGame() {

    gameRunning = false;

    clearInterval(gameTimer);


    let newRecord = false;


    if (score > highscore) {

        highscore =
            score;

        localStorage.setItem(
            "snakeBunnyHighscore",
            highscore
        );

        newRecord = true;

    }


    highscoreElement.textContent =
        highscore;


    finalScore.textContent =
        "Punkte: " + score;


    bestScore.textContent =
        "🏆 Highscore: " + highscore;


    if (newRecord && score > 0) {

        message.textContent =
            "✨ NEUER REKORD! Malina ist stolz! ✨";

    } else {

        message.textContent =
            "Malina braucht kurz eine Möhrchenpause. 🐰";

    }


    gameButton.textContent =
        "Nochmal spielen 🔄";


    overlay.style.display =
        "flex";

}


/* =====================================
   ZEICHNEN
   ===================================== */

function draw() {

    drawBackground();

    drawSnake();

    drawFood();

    drawGround();

}


/* =====================================
   HINTERGRUND
   ===================================== */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#bde5ed"
    );

    gradient.addColorStop(
        0.55,
        "#e7f2dd"
    );

    gradient.addColorStop(
        1,
        "#c6dda6"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* SONNE */

    ctx.fillStyle =
        "rgba(255,232,160,0.9)";

    ctx.beginPath();

    ctx.arc(
        canvas.width * 0.82,
        110,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* WOLKEN */

    drawCloud(
        canvas.width * 0.18,
        120,
        0.8
    );

    drawCloud(
        canvas.width * 0.68,
        220,
        0.55
    );


    /* HÜGEL */

    ctx.fillStyle =
        "#b5d494";

    ctx.beginPath();

    ctx.moveTo(
        0,
        canvas.height * 0.68
    );

    ctx.quadraticCurveTo(
        canvas.width * 0.25,
        canvas.height * 0.55,
        canvas.width * 0.52,
        canvas.height * 0.68
    );

    ctx.quadraticCurveTo(
        canvas.width * 0.76,
        canvas.height * 0.55,
        canvas.width,
        canvas.height * 0.67
    );

    ctx.lineTo(
        canvas.width,
        canvas.height
    );

    ctx.lineTo(
        0,
        canvas.height
    );

    ctx.closePath();

    ctx.fill();

}


/* =====================================
   WOLKEN
   ===================================== */

function drawCloud(
    x,
    y,
    scale
) {

    ctx.fillStyle =
        "rgba(255,255,255,0.72)";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        20 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 23 * scale,
        y - 11 * scale,
        28 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 49 * scale,
        y,
        22 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =====================================
   SNAKE
   ===================================== */

function drawSnake() {

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        const segment =
            snake[i];

        const x =
            segment.x *
            gridSize;

        const y =
            segment.y *
            gridSize;


        if (i === 0) {

            drawMalinaHead(
                x,
                y
            );

        } else {

            drawBody(
                x,
                y,
                i
            );

        }

    }

}


/* =====================================
   MALINA KOPF
   ===================================== */

function drawMalinaHead(
    x,
    y
) {

    const centerX =
        x + gridSize / 2;

    const centerY =
        y + gridSize / 2;


    ctx.save();

    ctx.translate(
        centerX,
        centerY
    );


    let angle = 0;


    if (direction.x === 1) {
        angle = 0;
    }

    if (direction.x === -1) {
        angle = Math.PI;
    }

    if (direction.y === 1) {
        angle = Math.PI / 2;
    }

    if (direction.y === -1) {
        angle = -Math.PI / 2;
    }


    ctx.rotate(angle);


    if (
        malinaImage.complete &&
        malinaImage.naturalWidth > 0
    ) {

        ctx.drawImage(
            malinaImage,
            -gridSize * 1.1,
            -gridSize * 1.1,
            gridSize * 2.2,
            gridSize * 2.2
        );

    } else {

        ctx.font =
            "28px serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "🐰",
            0,
            0
        );

    }


    ctx.restore();

}


/* =====================================
   KÖRPER
   ===================================== */

function drawBody(
    x,
    y,
    index
) {

    const centerX =
        x + gridSize / 2;

    const centerY =
        y + gridSize / 2;


    ctx.fillStyle =
        index % 2 === 0
            ? "#e8b7b8"
            : "#f2c9c5";


    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        gridSize * 0.39,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* kleines Herz */

    if (
        index % 3 === 0
    ) {

        ctx.fillStyle =
            "rgba(255,255,255,0.65)";

        ctx.font =
            "10px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "♥",
            centerX,
            centerY
        );

    }

}


/* =====================================
   KAROTTE
   ===================================== */

function drawFood() {

    const x =
        food.x *
        gridSize +
        gridSize / 2;

    const y =
        food.y *
        gridSize +
        gridSize / 2;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    /* GRÜN */

    ctx.fillStyle =
        "#619c59";


    ctx.beginPath();

    ctx.ellipse(
        -4,
        -12,
        3,
        8,
        -0.5,
        0,
        Math.PI * 2
    );

    ctx.ellipse(
        2,
        -13,
        3,
        9,
        0,
        0,
        Math.PI * 2
    );

    ctx.ellipse(
        7,
        -11,
        3,
        8,
        0.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* KAROTTE */

    ctx.fillStyle =
        "#ed8857";


    ctx.beginPath();

    ctx.moveTo(
        -8,
        -7
    );

    ctx.quadraticCurveTo(
        0,
        -2,
        8,
        -7
    );

    ctx.lineTo(
        2,
        13
    );

    ctx.quadraticCurveTo(
        0,
        17,
        -2,
        13
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =====================================
   BODEN
   ===================================== */

function drawGround() {

    const height = 55;


    ctx.fillStyle =
        "#9fc77c";


    ctx.fillRect(
        0,
        canvas.height - height,
        canvas.width,
        height
    );


    ctx.strokeStyle =
        "#709a5a";

    ctx.lineWidth = 2;


    for (
        let x = 0;
        x < canvas.width;
        x += 18
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            canvas.height - height
        );

        ctx.lineTo(
            x + 4,
            canvas.height - height - 7
        );

        ctx.stroke();

    }

}


/* =====================================
   TASTATUR
   ===================================== */

document.addEventListener(
    "keydown",
    event => {

        if (!gameRunning) {
            return;
        }


        if (
            event.key === "ArrowUp" &&
            direction.y !== 1
        ) {

            nextDirection = {
                x: 0,
                y: -1
            };

        }


        if (
            event.key === "ArrowDown" &&
            direction.y !== -1
        ) {

            nextDirection = {
                x: 0,
                y: 1
            };

        }


        if (
            event.key === "ArrowLeft" &&
            direction.x !== 1
        ) {

            nextDirection = {
                x: -1,
                y: 0
            };

        }


        if (
            event.key === "ArrowRight" &&
            direction.x !== -1
        ) {

            nextDirection = {
                x: 1,
                y: 0
            };

        }

    }
);


/* =====================================
   SWIPE
   ===================================== */

let touchStartX = 0;
let touchStartY = 0;


canvas.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        const touch =
            event.touches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive: false
    }
);


canvas.addEventListener(
    "touchend",
    event => {

        event.preventDefault();


        if (!gameRunning) {
            return;
        }


        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;


        if (
            Math.abs(dx) <
            20 &&
            Math.abs(dy) <
            20
        ) {
            return;
        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                dx > 0 &&
                direction.x !== -1
            ) {

                nextDirection = {
                    x: 1,
                    y: 0
                };

            }

            if (
                dx < 0 &&
                direction.x !== 1
            ) {

                nextDirection = {
                    x: -1,
                    y: 0
                };

            }

        } else {

            if (
                dy > 0 &&
                direction.y !== -1
            ) {

                nextDirection = {
                    x: 0,
                    y: 1
                };

            }

            if (
                dy < 0 &&
                direction.y !== 1
            ) {

                nextDirection = {
                    x: 0,
                    y: -1
                };

            }

        }

    },
    {
        passive: false
    }
);


/* =====================================
   BUTTON
   ===================================== */

gameButton.addEventListener(
    "click",
    startGame
);


/* =====================================
   INITIALISIERUNG
   ===================================== */

resizeCanvas();

draw();

</script>

</body>
</html>
